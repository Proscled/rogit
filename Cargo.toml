[package]
name = "rogit"
version = "0.3.1"
edition = "2024"
description = "Branches for your Roblox places' assets, with a Studio plugin. Scripts stay with Rojo."
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/Proscled/rogit"
homepage = "https://proscled.github.io/rogit"

[dependencies]
base64 = "0.23.1"
rbx_binary = "3.0.1"
rbx_dom_weak = "4.2.0"
rbx_reflection = "7.0.0"
rbx_reflection_database = "3.0.1"
rbx_types = "3.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.1.8"
ureq = "3.5.0"

[profile.release]
strip = true
lto = "thin"
