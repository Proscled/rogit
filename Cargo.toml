[package]
name = "rogit"
version = "0.4.1"
edition = "2024"
description = "Branches for your Roblox places' assets, with a Studio plugin. Scripts stay with Rojo."
license = "MPL-2.0"
readme = "README.md"
repository = "https://github.com/Proscled/rogit"
homepage = "https://proscled.github.io/rogit"

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
lz4_flex = "0.13.1"
rbx_binary = "3.0.1"
rbx_dom_weak = "4.2.0"
rbx_reflection = "7.0.0"
rbx_reflection_database = "3.0.1"
rbx_types = "3.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tiny_http = "0.12.0"
toml = "1.1.8"
ureq = "3.5.0"
zstd = "0.13.3"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
diffy = "0.5.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"
