# Publishes site/ (the install page and the install scripts) to GitHub Pages, with this repository's names filled
# in. In the repository's Settings → Pages, set Source to "GitHub Actions" once.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Fill in this repository's names
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir _site && cp -R site/. _site/
          sed -i -e "s|__REPO__|$GITHUB_REPOSITORY|g" -e "s|__SITE__|${BASE_URL#https://}|g" _site/*.html _site/*.sh _site/*.ps1
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
