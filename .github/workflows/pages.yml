# Publishes site/ (the install page and the install scripts) to GitHub Pages, with this repository's names filled
# in. In the repository's Settings → Pages, set Source to "GitHub Actions" once.
name: Site

on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Fill in this repository's names
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          mkdir _site && cp -R site/. _site/
          sed -i -e "s|__REPO__|$GITHUB_REPOSITORY|g" -e "s|__SITE__|${BASE_URL#https://}|g" _site/*.html _site/*.sh _site/*.ps1
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
