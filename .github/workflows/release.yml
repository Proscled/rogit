# Builds rogit for macOS and Windows when a version tag (v1.2.3) is pushed, and attaches zips that Rokit can
# install (`rokit add <owner>/rogit`) to the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo test --locked
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          zip="rogit-${GITHUB_REF_NAME#v}-${{ matrix.name }}.zip"
          cd "target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/$zip" rogit.exe
          else
            zip "$GITHUB_WORKSPACE/$zip" rogit
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: rogit-*.zip
