# Builds rogit for macOS and Windows when a version tag (v1.2.3) is pushed, and attaches zips that Rokit can
# install (`rokit add <owner>/rogit`) to the GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Check the tag matches Cargo.toml
        shell: bash
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match Cargo.toml version $version"
            exit 1
          fi
      - run: cargo test --locked
        if: matrix.target != 'x86_64-apple-darwin'
      - run: cargo build --release --locked --target ${{ matrix.target }}
      # Signs the Windows programs through SignPath, once it's set up: repository variables SIGNPATH_ORGANIZATION_ID,
      # SIGNPATH_PROJECT_SLUG and SIGNPATH_SIGNING_POLICY_SLUG, and the secret SIGNPATH_API_TOKEN. Until then these
      # steps are skipped and the programs ship unsigned.
      - name: Hand the Windows programs to SignPath
        id: unsigned
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows
          path: |
            target/${{ matrix.target }}/release/rogit.exe
            target/${{ matrix.target }}/release/rogit-background.exe
      - name: Sign the Windows programs
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use the signed programs
        if: runner.os == 'Windows' && vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: cp signed/rogit.exe signed/rogit-background.exe "target/${{ matrix.target }}/release/"
      - name: Package
        shell: bash
        run: |
          # No version in the name, so the installers can always fetch releases/latest/download/<name>.
          zip="rogit-${{ matrix.name }}.zip"
          cd "target/${{ matrix.target }}/release"
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a "$GITHUB_WORKSPACE/$zip" rogit.exe rogit-background.exe
          else
            zip "$GITHUB_WORKSPACE/$zip" rogit
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: rogit-*.zip
