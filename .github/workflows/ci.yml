name: CI

on:
  push:
  pull_request:

# CI only reads the code.
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo test --locked

  plugin:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check that the plugin's scripts parse
        run: |
          curl -sSL -o stylua.zip https://github.com/JohnnyMorganz/StyLua/releases/download/v2.5.2/stylua-linux-x86_64.zip
          unzip -q stylua.zip
          for file in plugin/*.lua; do ./stylua --syntax luau - < "$file" > /dev/null; done

  # Runs the installers from site/ against the build from this commit: a stand-in download hands them a fresh zip.
  installers:
    timeout-minutes: 20
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - run: cargo build --release --locked
      - name: Install on macOS
        if: runner.os == 'macOS'
        # A CI machine has no login session for a LaunchAgent; starting at login is checked by hand.
        env:
          ROGIT_NO_AUTOSTART: "1"
        run: |
          trap 'echo "::error::Failed at line $LINENO of the macOS installer step"' ERR
          (cd target/release && zip -q "$RUNNER_TEMP/rogit.zip" rogit)
          mkdir -p "$RUNNER_TEMP/fake"
          printf '#!/bin/sh\nwhile [ $# -gt 0 ]; do [ "$1" = -o ] && out="$2"; shift; done\ncp "$RUNNER_TEMP/rogit.zip" "$out"\n' > "$RUNNER_TEMP/fake/curl"
          chmod +x "$RUNNER_TEMP/fake/curl"
          PATH="$RUNNER_TEMP/fake:$PATH" sh site/install.sh
          PATH="$RUNNER_TEMP/fake:$PATH" sh site/install.sh
          test "$(grep -c rogit/env ~/.zshenv)" = 1
          zsh -c 'rogit --version'
          test -f ~/Documents/Roblox/Plugins/RoGit.rbxm
          # Uninstalling takes back everything the installer did, and keeps branches.
          mkdir -p ~/.rogit/games/1 && touch ~/.rogit/games/1/game.toml
          ~/.rogit/bin/rogit uninstall
          if grep -q rogit/env ~/.zshenv; then echo 'PATH line left in .zshenv'; exit 1; fi
          test ! -e ~/.rogit/bin && test ! -e ~/.rogit/env && test ! -e ~/Documents/Roblox/Plugins/RoGit.rbxm
          test -f ~/.rogit/games/1/game.toml
      - name: Check the Windows programs' details
        if: runner.os == 'Windows'
        shell: powershell
        # Their name, version and icon (build.rs). Microsoft Defender is quicker to call a program without them malware.
        run: |
          $ErrorActionPreference = 'Stop'
          trap { Write-Output "::error::$_"; exit 1 }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          foreach ($exe in 'rogit', 'rogit-background') {
            $info = (Get-Item "target\release\$exe.exe").VersionInfo
            if ($info.ProductName -ne 'RoGit' -or $info.ProductVersion -ne $version -or $info.OriginalFilename -ne "$exe.exe") {
              throw "$exe.exe is missing its Windows details: $(($info | Format-List | Out-String) -replace '\s+', ' ')"
            }
          }
      - name: Install on Windows
        if: runner.os == 'Windows'
        # Windows PowerShell 5.1, which the one-line install command uses.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          # Failures become annotations, which anyone can read (the log needs admin rights).
          trap { Write-Output "::error::$_"; exit 1 }
          Compress-Archive -Path target\release\rogit.exe, target\release\rogit-background.exe -DestinationPath "$env:RUNNER_TEMP\rogit.zip"
          function Invoke-WebRequest { param($Uri, $OutFile, [switch]$UseBasicParsing) Copy-Item "$env:RUNNER_TEMP\rogit.zip" $OutFile }
          $bin = "$env:LOCALAPPDATA\rogit\bin"
          # What the installer printed, for the error message if something's wrong.
          $installed = (Get-Content site\install.ps1 -Raw | Invoke-Expression) *>&1 | Out-String
          Write-Output $installed
          # RoGit runs in the background and starts at login.
          function Wait-RoGit {
            $until = (Get-Date).AddSeconds(60)
            while ((Get-Date) -lt $until) {
              try { return Invoke-RestMethod -TimeoutSec 5 http://127.0.0.1:34875/api/rogit } catch { Start-Sleep -Milliseconds 500 }
            }
            $running = (Get-Process rogit* -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Id)" }) -join ', '
            $entry = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run -ErrorAction SilentlyContinue).RoGit
            $files = (Get-ChildItem $bin -ErrorAction SilentlyContinue).Name -join ', '
            $log = Get-Content "$env:LOCALAPPDATA\rogit\serve.log" -Raw -ErrorAction SilentlyContinue
            throw "RoGit is not running in the background. Running: [$running]. Login entry: [$entry]. Files: [$files]. Its log: [$($log -replace '\s+', ' ')]. Installer said: $($installed -replace '\s+', ' ')"
          }
          $reply = Wait-RoGit
          if ($reply.server -ne 'rogit') { throw "Unexpected reply: $reply" }
          # rogit works right away in the window that installed it.
          rogit --version
          if ($LASTEXITCODE -ne 0) { throw 'rogit is not on PATH in the installing window.' }
          $run = (Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).RoGit
          if ($run -ne "`"$bin\rogit-background.exe`"") { throw "RoGit doesn't start at login: $run" }
          if (Test-Path "$env:LOCALAPPDATA\rogit\start.vbs") { throw 'A start script was written.' }
          # Update while the background RoGit has its program open.
          $before = (Get-Process rogit-background).Id
          $installed = (Get-Content site\install.ps1 -Raw | Invoke-Expression) *>&1 | Out-String
          Write-Output $installed
          Wait-RoGit | Out-Null
          $after = (Get-Process rogit-background).Id
          if (@($after).Count -ne 1 -or $before -contains $after) { throw "The update didn't replace the running RoGit: $before -> $after" }
          $key = Get-Item HKCU:\Environment
          if ($key.GetValueKind('Path') -ne 'ExpandString') { throw 'PATH is no longer an expandable string.' }
          $path = $key.GetValue('Path', '', 'DoNotExpandEnvironmentNames') -split ';'
          if (@($path | Where-Object { $_ -eq $bin }).Count -ne 1) { throw "rogit's folder should be on PATH once: $path" }
          & "$bin\rogit.exe" --version
          if (-not (Test-Path "$env:LOCALAPPDATA\Roblox\Plugins\RoGit.rbxm")) { throw "The plugin wasn't installed." }
          # Uninstalling takes back everything the installer did, and keeps branches.
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\rogit\games\1" | Out-Null
          Set-Content "$env:LOCALAPPDATA\rogit\games\1\game.toml" ''
          & "$bin\rogit.exe" uninstall
          if ($LASTEXITCODE -ne 0) { throw 'rogit uninstall failed.' }
          Start-Sleep -Seconds 6
          if ((Get-ItemProperty HKCU:\Software\Microsoft\Windows\CurrentVersion\Run).RoGit) { throw 'RoGit still starts at login.' }
          if (Get-Process rogit, rogit-background -ErrorAction SilentlyContinue) { throw 'RoGit is still running.' }
          $path = (Get-Item HKCU:\Environment).GetValue('Path', '', 'DoNotExpandEnvironmentNames') -split ';'
          if ($path -contains $bin) { throw "rogit is still on PATH: $path" }
          if (Test-Path $bin) { throw "$bin is still there." }
          if (Test-Path "$env:LOCALAPPDATA\Roblox\Plugins\RoGit.rbxm") { throw 'The plugin is still installed.' }
          if (-not (Test-Path "$env:LOCALAPPDATA\rogit\games\1\game.toml")) { throw 'Uninstalling removed branches.' }
